[package]
name = "media-hub"
version = "1.0.2"
description = "Media Hub — download manager + media library for video editors"
authors = ["Guilherme"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a Windows-only conflict with the bin name.
# https://github.com/rust-lang/cargo/issues/8519
name = "media_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
trash = "5.2.6"
tauri-plugin-dialog = "2.7.1"
