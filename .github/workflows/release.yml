name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.4.0 && git push origin v1.4.0
#
# Builds macOS (Apple Silicon) + Windows in parallel, signs the updater
# artifacts, and uploads everything to a DRAFT GitHub release named for
# the tag. Review the draft, add notes, then publish.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/media-hub.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password (empty for ours)
#   MH_DEPS_TOKEN                       PAT with read access to the PRIVATE
#                                       guilhermebarony-coder/media-hub-deps
#                                       repo, which holds nvngx_vsr.dll.
#                                       Set 2026-08-21, NO expiry -- so if the
#                                       Windows job ever fails on gh auth it is
#                                       a revoked/rotated token, not a lapsed
#                                       one. To replace: fine-grained PAT,
#                                       owner guilhermebarony-coder, ONLY the
#                                       media-hub-deps repo, Contents:
#                                       Read-only, then
#                                         gh secret set MH_DEPS_TOKEN \
#                                           --repo guilhermebarony-coder/media-hub
#
# Why that last one exists: since 1.15.0 the Windows installer PACKS NVIDIA's
# nvngx_vsr.dll (bundle.resources in tauri.windows.conf.json). It cannot be in
# this public repo, and it cannot sit behind a public URL either -- NVIDIA's
# grant covers redistribution incorporated into an application, not standalone
# hosting. So the Windows runner pulls it from a private repo at build time.
# Without the secret the Windows job fails at COMPILE time with
# "resource path resources/nvngx_vsr.dll doesn't exist".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  build:
    permissions:
      contents: write # create/upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon runner
            rust_target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin"
            fetch_sidecars: bash scripts/fetch-sidecars-mac.sh
            smoke_test: bash scripts/smoke-test.sh
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
            fetch_sidecars: pwsh scripts/fetch-sidecars.ps1
            smoke_test: pwsh scripts/smoke-test.ps1

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # These pins rot silently and nothing used to notice. BtbN stopped
      # publishing n7.1 and it broke two things at once: this workflow, and
      # every FRESH WINDOWS INSTALL -- since 1.12.0 the app downloads ffmpeg
      # on first launch and ToolsGate blocks until it lands, so a dead URL in
      # tools.rs bricks setup for new users while existing ones never notice.
      # Runs before the expensive steps so it fails in seconds.
      - name: Verify runtime download URLs
        shell: bash
        run: |
          fail=0
          urls=$(grep -oE 'url: "https://[^"]+' src-tauri/src/tools.rs | sed 's/url: "//' | sort -u)
          for u in $urls; do
            code=$(curl -s -o /dev/null -L -r 0-15 -w '%{http_code}' "$u")
            case "$code" in
              200|206) echo "  ok    $code  $u" ;;
              *)       echo "  DEAD  $code  $u"; fail=1 ;;
            esac
          done
          if [ "$fail" != "0" ]; then
            echo ""
            echo "A URL baked into src-tauri/src/tools.rs is dead. Shipping this"
            echo "would leave fresh installs unable to fetch their sidecars."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # Fetch sidecars FIRST — `cargo test` below compiles the crate, and
      # tauri-build validates that the externalBin resource
      # (binaries/yt-dlp-<triple>) exists at compile time. If we run tests
      # before fetching, that check fails with "resource path ... doesn't
      # exist" (exit 101). So: fetch, then test, then smoke, then build.
      - name: Fetch sidecars (yt-dlp + ffmpeg + NVIDIA runtime on Windows)
        env:
          MH_DEPS_TOKEN: ${{ secrets.MH_DEPS_TOKEN }}
        run: ${{ matrix.fetch_sidecars }}

      # Layer A — pure-logic unit tests (parsers, JSON deserialization,
      # preset resolution). Catches regressions like the null-chapters
      # crash before they ship.
      - name: Unit tests (cargo test)
        working-directory: src-tauri
        run: cargo test --lib

      # Layer B — real pipeline smoke test with the ACTUAL fetched ffmpeg,
      # BEFORE building. Catches "the bundled binary behaves differently"
      # bugs (the transcode "no packets" failure) that unit tests can't see.
      # Fails the release job -> no bad build reaches a tester.
      - name: Smoke test (real ffmpeg pipeline)
        run: ${{ matrix.smoke_test }}

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Media Hub ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}
