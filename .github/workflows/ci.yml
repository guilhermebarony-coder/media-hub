name: CI

# Fast feedback on every push / PR: typecheck + Rust unit tests. No
# sidecars, no build — just the cheap checks that catch logic regressions
# (like the null-chapters JSON crash) the moment they're committed, instead
# of at release time. The full pipeline smoke test lives in release.yml.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit tests are pure logic, but `cargo test` still has to COMPILE
      # the crate, which links Tauri's Linux GUI stack. Install those dev
      # packages or the build fails on glib-sys/webkit2gtk.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      # tauri-build checks that each externalBin exists for the host target
      # triple. The unit tests never invoke the sidecars, so empty stub
      # files satisfy the build-time existence check without fetching the
      # ~322 MB of real binaries (that's the release job's concern).
      - name: Stub sidecars (satisfy tauri-build existence check)
        run: |
          mkdir -p src-tauri/binaries
          for bin in yt-dlp ffmpeg deno; do
            touch "src-tauri/binaries/${bin}-x86_64-unknown-linux-gnu"
          done

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
